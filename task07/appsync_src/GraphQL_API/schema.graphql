type Event {
    id: ID!
    userId: Int!
    createdAt: AWSDateTime!
    payLoad: EventPayLoad!
}

type EventPayLoad {
    meta: EventMeta!
}

type EventMeta {
    key1: Int!
    key2: String!
}

type Mutation {
    createEvent(
        userId: Int!,
        payLoad: AWSJSON!
    ): Event!
}

type Query {
    getEvent(id: ID!): Event
}

schema {
    query: Query
    mutation: Mutation
}